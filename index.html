<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS · Fornecedores e contratantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>/* ============ TOKENS ============ */
:root{
  --verde:#16A34A; --verde-f:#15803D; --verde-c:#DCFCE7;
  --laranja:#F97316; --laranja-f:#C2410C; --laranja-c:#FFEDD5;
  --tinta:#1C1917; --suave:#78716C; --leve:#A8A29E;
  --linha:#D6D3D1; --borda:#B7B0A8; --fundo:#FAFAF9; --branco:#FFFFFF;
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--fundo);color:var(--tinta);font-size:15px;
  line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:70px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.25}
.env{max-width:1140px;margin:0 auto;padding:0 22px}
.vazio{color:var(--leve)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:4px}

/* ============ TOPO ============ */
.topo{background:var(--branco);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:30}
.topo .env{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.marca em{font-style:normal;width:9px;height:9px;border-radius:50%;background:var(--laranja);flex:none}
.marca span{font-weight:400;font-size:13px;color:var(--leve)}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fonte{font-size:11px;color:var(--leve)}
.lnk{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--suave)}
.lnk:hover{background:var(--fundo);color:var(--tinta)}
.lnk.on{background:var(--tinta);color:#fff}

/* ============ RESUMO ============ */
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:26px 0 4px}
.kpi{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);padding:16px 18px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .r{font-size:12.5px;color:var(--suave);margin-top:2px;display:flex;align-items:center;gap:7px}
.kpi .r em{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--leve);flex:none}
.kpi.vd .v{color:var(--verde)} .kpi.vd .r em{background:var(--verde)}
.kpi.lj .v{color:var(--laranja)} .kpi.lj .r em{background:var(--laranja)}

/* ============ BOLINHA ============ */
.bol{width:10px;height:10px;border-radius:50%;background:var(--c,var(--leve));position:relative;
  flex:none;display:inline-block}
.bol[data-p="1"]::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:var(--c);animation:pulso 2s cubic-bezier(.3,0,.3,1) infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.8);opacity:0}100%{transform:scale(2.8);opacity:0}}
.s-uso{--c:var(--verde)} .s-web{--c:var(--verde)} .s-espera{--c:var(--laranja)}
.s-bloq{--c:var(--laranja-f)} .s-agd{--c:var(--laranja)} .s-pend{--c:#C4BEB7}
.s-ativo{--c:var(--verde)} .s-inativo{--c:#C4BEB7}
.sit{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--c,var(--suave))}
.sit.s-pend,.sit.s-inativo{color:var(--leve)}

/* ============ ABAS ============ */
.abas{display:flex;gap:6px;padding:22px 0 0;border-bottom:1px solid var(--borda);margin-bottom:2px}
.abas button{font-size:14px;font-weight:500;color:var(--suave);padding:10px 4px 12px;margin-right:18px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button:hover{color:var(--tinta)}
.abas button[aria-selected="true"]{color:var(--tinta);font-weight:600;border-bottom-color:var(--laranja)}
.abas button b{font-weight:500;color:var(--leve);margin-left:6px;font-size:12.5px}

/* ============ TAGS DE PRODUTO ============ */
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;
  background:var(--verde-c);color:var(--verde-f);border:1px solid #A7E3BE}
.tag.off{background:var(--fundo);color:var(--leve);border-color:var(--borda);font-weight:400}
.par .tags{margin-top:4px}

/* ============ CHECKBOXES DE PRODUTO ============ */
.escolhas{display:flex;gap:8px;flex-wrap:wrap}
.escolha{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--borda);
  border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--branco)}
.escolha:hover{border-color:var(--suave)}
.escolha:has(input:checked){background:var(--verde-c);border-color:var(--verde);color:var(--verde-f)}
.escolha input{accent-color:var(--verde);width:15px;height:15px;cursor:pointer}

/* ============ FILTROS ============ */
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:22px 0 16px}
.busca{position:relative;flex:1 1 240px;min-width:190px}
.busca input{width:100%;background:var(--branco);border:1px solid var(--borda);border-radius:999px;
  padding:11px 16px 11px 40px;font-size:14px}
.busca input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-c)}
.busca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--leve)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;color:var(--suave);border:1px solid var(--borda);background:var(--branco);
  padding:8px 14px;border-radius:999px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--leve);color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip b{font-weight:500;opacity:.55;margin-left:6px}

/* ============ CARDS ============ */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);padding:18px;
  text-align:left;display:flex;flex-direction:column;gap:11px;min-height:152px;width:100%;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--suave);transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,25,23,.06)}
.card h3{font-size:15px;font-weight:600}
.card .meta{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;margin-top:-4px}
.card .pe{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--linha);padding-top:12px;margin-top:auto}
.card .pe small{font-size:11.5px;color:var(--leve);font-variant-numeric:tabular-nums}

.trilha{display:flex;gap:6px;align-items:center}
.trilha i{width:9px;height:9px;border-radius:50%;background:#DAD6D2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.trilha i[data-on="1"][data-e="1"],.trilha i[data-on="1"][data-e="2"]{background:var(--laranja)}
.trilha i[data-on="1"][data-e="3"],.trilha i[data-on="1"][data-e="4"]{background:var(--verde)}
.trilha i[data-pulo="1"]{background:var(--branco);box-shadow:inset 0 0 0 2.5px var(--verde)}

.nada{grid-column:1/-1;background:var(--branco);border:1px dashed var(--borda);border-radius:var(--r);
  padding:52px 20px;text-align:center;color:var(--suave)}
.nada b{display:block;color:var(--tinta);font-size:16px;margin-bottom:5px;font-weight:600}
.rodape{padding:20px 2px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:12px;color:var(--leve)}

/* ============ MODAL ============ */
.veu{position:fixed;inset:0;background:rgba(28,25,23,.38);-webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.veu.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);
  width:min(560px,calc(100% - 32px));max-height:min(88vh,880px);background:var(--branco);
  border-radius:18px;box-shadow:0 24px 60px rgba(28,25,23,.22);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .2s cubic-bezier(.2,.9,.3,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-topo{padding:22px 24px 16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--borda)}
.modal-topo h2{font-size:19px;padding-right:4px}
.modal-topo .sit{margin-bottom:7px}
.fechar{margin-left:auto;width:32px;height:32px;border-radius:50%;color:var(--suave);
  font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.fechar:hover{background:var(--fundo);color:var(--tinta)}
.modal-corpo{overflow-y:auto;padding:6px 24px 22px;flex:1}
.bloco{padding:18px 0;border-bottom:1px solid var(--linha)}
.bloco:last-child{border-bottom:none;padding-bottom:4px}
.rot{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--leve);margin-bottom:14px}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.par dt{font-size:11.5px;color:var(--leve);margin-bottom:2px}
.par dd{font-size:14px;font-weight:500;overflow-wrap:break-word}
.par.larga{grid-column:1/-1}

.passos{display:grid;gap:2px}
.passo{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.passo .pt{width:10px;height:10px;border-radius:50%;background:#DAD6D2;margin:0 auto}
.passo[data-on="1"][data-e="1"] .pt,.passo[data-on="1"][data-e="2"] .pt{background:var(--laranja)}
.passo[data-on="1"][data-e="3"] .pt,.passo[data-on="1"][data-e="4"] .pt{background:var(--verde)}
.passo[data-on="0"]{color:var(--leve)}
.passo small{font-size:12px;color:var(--leve);font-variant-numeric:tabular-nums}

/* ============ BOTÕES / FORM ============ */
.bt{font-size:13px;font-weight:500;border:1px solid var(--borda);background:var(--branco);
  padding:10px 16px;border-radius:999px;white-space:nowrap;transition:.15s}
.bt:hover{border-color:var(--leve);background:var(--fundo)}
.bt.forte{background:var(--verde);border-color:var(--verde);color:#fff}
.bt.forte:hover{background:var(--verde-f);border-color:var(--verde-f)}
.bt.laranja{background:var(--laranja);border-color:var(--laranja);color:#fff}
.bt.laranja:hover{background:var(--laranja-f);border-color:var(--laranja-f)}
.bt.perigo{color:var(--laranja-f);border-color:#F5D0BC}
.bt.perigo:hover{background:#FFF4ED}
.bt:disabled{opacity:.5;cursor:not-allowed}
.barra-adm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:20px 0 0}

.aviso{border-radius:var(--r);padding:13px 16px;font-size:13px;margin:16px 0;display:flex;gap:11px;
  align-items:flex-start;line-height:1.5;background:var(--laranja-c);color:#7C2D12}
.aviso.ok{background:var(--verde-c);color:#14532D}
.aviso.ruim{background:#FEE2E2;color:#7F1D1D}
.aviso b{font-weight:600}
.aviso code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-size:12px}

.campo{margin-bottom:14px}
.campo label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:5px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;background:var(--branco);border:1px solid var(--borda);
  border-radius:10px;padding:10px 12px;font-size:14px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--verde);
  box-shadow:0 0 0 3px var(--verde-c)}
.campo textarea{resize:vertical;min-height:74px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-pe{padding:16px 24px;border-top:1px solid var(--borda);display:flex;gap:8px;
  justify-content:flex-end;background:var(--fundo);border-radius:0 0 18px 18px;flex-wrap:wrap}
#excluir{margin-right:auto}

details.cofre{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);margin:16px 0}
details.cofre summary{padding:15px 18px;cursor:pointer;font-size:13.5px;font-weight:500;border-radius:var(--r)}
details.cofre[open] summary{border-bottom:1px solid var(--linha);border-radius:var(--r) var(--r) 0 0}
details.cofre .dentro{padding:18px;max-width:560px}
.dica{font-size:13px;color:var(--suave);line-height:1.55;margin-bottom:16px}
.dica code{background:var(--fundo);border:1px solid var(--linha);padding:1px 5px;border-radius:4px;font-size:12px}

.card .acao{display:flex;gap:6px}
.card .acao button{font-size:11.5px;font-weight:500;color:var(--suave);border:1px solid var(--borda);
  padding:5px 10px;border-radius:999px}
.card .acao button:hover{border-color:var(--leve);color:var(--tinta)}
.card .acao button.x:hover{border-color:#F5D0BC;color:var(--laranja-f);background:#FFF4ED}

/* ============ RESPONSIVO ============ */
@media(max-width:860px){
  .resumo{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:24px}
}
@media(max-width:520px){
  .grade{grid-template-columns:1fr}
  .pares,.dupla{grid-template-columns:1fr}
  .modal{max-height:92vh}
  .modal-topo,.modal-corpo,.modal-pe{padding-left:18px;padding-right:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topo">
  <div class="env">
    <div class="marca"><em></em>IRIS <span>Fornecedores e contratantes</span></div>
    <div class="topo-dir"><span class="fonte" id="selo-fonte"></span><button class="lnk" onclick="sair()">Sair</button></div>
  </div>
</header>

<main class="env">
  <nav class="abas" id="abas" role="tablist">
    <button role="tab" data-aba="fornecedores" aria-selected="true">Fornecedores<b id="n-f"></b></button>
    <button role="tab" data-aba="contratantes" aria-selected="false">Contratantes<b id="n-c"></b></button>
  </nav>

  <section class="resumo" id="resumo"></section>

  <div class="filtros">
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="busca" type="search" placeholder="Buscar…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grade" id="grade"></div>

  <div class="rodape">
    <span id="contagem"></span>
    <span id="atualizado"></span>
  </div>
</main>

<div class="veu" id="veu"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-nome">
  <div class="modal-topo">
    <div><div id="m-sit"></div><h2 id="m-nome"></h2></div>
    <button class="fechar" id="fechar" aria-label="Fechar">&#10005;</button>
  </div>
  <div class="modal-corpo" id="m-corpo"></div>
</div>

<script src="supabase-client.js"></script>
<script>/* ===== GUARDA DE SESSÃO ===== */
const SESSAO_OK = 'baa15d3f8dd6ff59ae1802fd123ff8c959a35dd631879b25c25908e76ec06d73';
if(sessionStorage.getItem('iris_sessao') !== SESSAO_OK){
  location.replace('login.html?volta=' + encodeURIComponent(location.pathname.split('/').pop() + location.hash));
}
function sair(){ sessionStorage.removeItem('iris_sessao'); location.replace('login.html'); }

/* ===== NÚCLEO IRIS — lógica compartilhada entre View e Admin ===== */

const CAMPOS_VAZIOS = {
  id:'', nome:'', status:'Pendente', dtAgendamento:'', dtTreinamento:'', app:'', uso:'',
  motivo:'', temSistema:'', qualSistema:'', celular:'', frota:'', gps:'',
  dtInicioUso:'', empresaGps:'', telefone:'', obs:''
};

const CAMPOS_CONTRATANTE = { id:'', codigo:'', nome:'', status:'Ativo', produtos:[],
  treinamento:'Não', dtTreinamento:'', obs:'' };
const PRODUTOS = ['P1','P2','P3','P4'];

const OPCOES = {
  statusContratante: ['Ativo','Inativo'],
  simnaoC: ['Não','Sim'],
  status:  ['Pendente','Agendado','Treinado'],
  app:     ['','Sim','Não'],
  uso:     ['','Sim','Não','WEB'],
  motivo:  ['','Em Instalação','Sem Dispositivo','Usa Outro Sistema','iOS Incompatível','Recusa/Objeção','Não Quis','Inativo'],
  simnao:  ['','Sim','Não'],
  celular: ['','Sim','Não','somente pessoais'],
  sistema: ['','IRIS','Próprio','TCI','Ubr','Ezra']
};

const MOTIVOS_TRAVA = ['Recusa/Objeção','Não Quis','iOS Incompatível','Inativo'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function normalizar(f){ return Object.assign({}, CAMPOS_VAZIOS, f); }
function normalizarC(c){
  const o = Object.assign({}, CAMPOS_CONTRATANTE, c);
  o.produtos = Array.isArray(o.produtos) ? o.produtos.slice().sort() : [];
  return o;
}
function situacaoC(c){
  if(c.status === 'Inativo') return {k:'inativo', t:'Inativo'};
  return c.treinamento === 'Sim' ? {k:'ativo', t:'Ativo · treinado'} : {k:'agd', t:'Ativo · sem treinamento'};
}
const PESO_C = {ativo:0, agd:1, inativo:2};
function rotuloC(c){ return c.nome || ('Contratante ' + (c.codigo || 's/ código')); }

function idDe(nome, usados){
  let base = (nome||'fornecedor').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,48) || 'fornecedor';
  let id = base, i = 2;
  while(usados.has(id)){ id = base+'-'+(i++); }
  return id;
}

/* ---- situação consolidada (o que a planilha não mostra) ---- */
function situacao(f){
  if(f.uso === 'Sim') return {k:'uso',    t:'Em uso'};
  if(f.uso === 'WEB') return {k:'web',    t:'Em uso · web'};
  if(f.status === 'Treinado'){
    if(MOTIVOS_TRAVA.includes(f.motivo)) return {k:'bloq', t:f.motivo};
    return {k:'espera', t: f.motivo || 'Treinado · sem uso'};
  }
  if(f.status === 'Agendado') return {k:'agd', t:'Agendado'};
  return {k:'pend', t:'Pendente'};
}

/* ---- as 4 etapas da trilha de adoção ---- */
function etapas(f){
  const treinado = f.status === 'Treinado';
  return [
    {rot:'AGD', nome:'Agendamento',   on: !!f.dtAgendamento || treinado || f.status==='Agendado',
     qd: dataCurta(f.dtAgendamento) || (treinado ? 'sem data' : '')},
    {rot:'TRN', nome:'Treinamento',   on: treinado, qd: dataCurta(f.dtTreinamento) || (treinado ? 'sem data' : '')},
    {rot:'APP', nome:'App instalado', on: f.app === 'Sim', qd: f.app || ''},
    {rot:'USO', nome:'Em uso',        on: f.uso === 'Sim' || f.uso === 'WEB',
     qd: f.uso === 'WEB' ? 'pela web' : f.uso || ''}
  ];
}

function contarEtapas(lista){
  const c = [0,0,0,0];
  lista.forEach(f => etapas(f).forEach((e,i) => { if(e.on) c[i]++; }));
  return c;
}

/* ---- datas ---- */
function dataCurta(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return d && m ? `${d}/${m}/${a.slice(2)}` : '';
}
function dataLonga(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return d && m ? `${d}/${m}/${a}` : '';
}
function mesAno(iso){
  if(!iso) return '';
  const [a,m] = iso.split('-');
  return `${MESES[parseInt(m,10)-1]} ${a}`;
}
function diasDesde(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

/* ---- busca ---- */
function chave(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

/* ---- carregamento: Supabase primeiro, arquivo como reserva ---- */
async function carregarDados(){
  try{
    if(window.IRIS_DB?.configurado){
      const remoto = await window.IRIS_DB.carregarDoc();
      if(remoto && Array.isArray(remoto.fornecedores)) return {doc:remoto, fonte:'supabase'};
    }
  }catch(e){
    console.warn('Supabase indisponivel, usando dados.json.', e);
  }
  try{
    const r = await fetch('dados.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(!Array.isArray(j.fornecedores)) throw new Error('formato');
    return {doc:j, fonte:'arquivo'};
  }catch(e){
    return {doc: JSON.parse(JSON.stringify(SEMENTE)), fonte:'embutido'};
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- bolinhas: situação, trilha e card ---- */
function pulsa(f){ return f.status === 'Treinado' ? 1 : 0; }

function sitHTML(f){
  const s = situacao(f);
  return `<span class="sit s-${s.k}"><span class="bol" data-p="${pulsa(f)}"></span>${esc(s.t)}</span>`;
}

function trilhaHTML(f){
  const et = etapas(f);
  return '<div class="trilha" aria-label="etapas concluídas">' + et.map((e,i) => {
    const pulo = (i === 3 && e.on && !et[2].on) ? ' data-pulo="1"' : '';
    return `<i data-on="${e.on?1:0}" data-e="${i+1}"${pulo} title="${e.nome}: ${e.on ? 'sim' : 'não'}"></i>`;
  }).join('') + '</div>';
}

function cardHTML(f, rodape){
  const feitas = etapas(f).filter(e => e.on).length;
  const meta = [
    f.dtTreinamento ? 'Treinado em ' + dataCurta(f.dtTreinamento) : 'Sem treinamento',
    f.frota !== '' ? f.frota + ' veículos' : ''
  ].filter(Boolean).join(' · ');
  return `<div class="card" role="button" tabindex="0" data-id="${esc(f.id)}">
    ${sitHTML(f)}
    <h3>${esc(f.nome)}</h3>
    <div class="meta">${meta}</div>
    <div class="pe">${trilhaHTML(f)}${rodape || `<small>${feitas} de 4 etapas</small>`}</div>
  </div>`;
}

function ligarCards(raiz, aoAbrir){
  raiz.querySelectorAll('.card').forEach(c => {
    const ir = () => aoAbrir(c.dataset.id);
    c.addEventListener('click', e => { if(!e.target.closest('.acao')) ir(); });
    c.addEventListener('keydown', e => {
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.acao')){ e.preventDefault(); ir(); }
    });
  });
}

/* ---- passos detalhados dentro do modal ---- */
function passosHTML(f){
  return '<div class="passos">' + etapas(f).map((e,i) =>
    `<div class="passo" data-on="${e.on?1:0}" data-e="${i+1}">
       <span class="pt"></span><span>${e.nome}</span><small>${esc(e.qd) || '—'}</small>
     </div>`).join('') + '</div>';
}

/* ---- contratantes ---- */
function sitCHTML(c){
  const s = situacaoC(c);
  return `<span class="sit s-${s.k}"><span class="bol" data-p="${c.treinamento === 'Sim' ? 1 : 0}"></span>${s.t}</span>`;
}

function tagsHTML(c){
  return '<div class="tags">' + (c.produtos.length
    ? c.produtos.map(p => `<span class="tag">${esc(p)}</span>`).join('')
    : '<span class="tag off">sem produto</span>') + '</div>';
}

function cardCHTML(c, rodape){
  const meta = c.treinamento === 'Sim'
    ? (c.dtTreinamento ? 'Treinado em ' + dataCurta(c.dtTreinamento) : 'Treinado, sem data')
    : 'Sem treinamento';
  return `<div class="card" role="button" tabindex="0" data-id="${esc(c.id)}">
    ${sitCHTML(c)}
    <h3>${esc(rotuloC(c))}</h3>
    <div class="meta">${meta}</div>
    <div class="pe">${tagsHTML(c)}${rodape || ''}</div>
  </div>`;
}

let DOC = {fornecedores:[], contratantes:[]}, aba = 'fornecedores', filtro = 'todos', termo = '';

const FILTROS_F = [
  {k:'todos',  r:'Todos',            f:() => true},
  {k:'uso',    r:'Em uso',           f:x => ['uso','web'].includes(situacao(x).k)},
  {k:'espera', r:'Treinado sem uso', f:x => situacao(x).k === 'espera'},
  {k:'bloq',   r:'Com impedimento',  f:x => situacao(x).k === 'bloq'},
  {k:'agd',    r:'Agendado',         f:x => situacao(x).k === 'agd'},
  {k:'pend',   r:'Pendente',         f:x => situacao(x).k === 'pend'}
];
const FILTROS_C = [
  {k:'todos',    r:'Todos',           f:() => true},
  {k:'ativo',    r:'Ativos',          f:c => c.status !== 'Inativo'},
  {k:'inativo',  r:'Inativos',        f:c => c.status === 'Inativo'},
  {k:'treinado', r:'Treinados',       f:c => c.treinamento === 'Sim'},
  {k:'semtrn',   r:'Sem treinamento', f:c => c.treinamento !== 'Sim'}
].concat(PRODUTOS.map(p => ({k:'prod-'+p, r:p, f:c => c.produtos.includes(p)})));

const filtros = () => aba === 'fornecedores' ? FILTROS_F : FILTROS_C;
const base = () => aba === 'fornecedores' ? DOC.fornecedores : DOC.contratantes;

(async function(){
  const r = await carregarDados();
  DOC = r.doc;
  DOC.fornecedores = (DOC.fornecedores || []).map(normalizar);
  DOC.contratantes = (DOC.contratantes || []).map(normalizarC);
  document.getElementById('selo-fonte').textContent =
    r.fonte === 'supabase' ? 'Supabase' : r.fonte === 'arquivo' ? 'dados.json' : 'dados embutidos';
  document.getElementById('atualizado').textContent = 'Atualizado em ' + (dataLonga(DOC.atualizadoEm) || '—');
  document.getElementById('n-f').textContent = DOC.fornecedores.length;
  document.getElementById('n-c').textContent = DOC.contratantes.length;

  document.querySelectorAll('#abas button').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.aba === aba) return;
    aba = b.dataset.aba; filtro = 'todos'; termo = '';
    document.getElementById('busca').value = '';
    document.getElementById('busca').placeholder = aba === 'fornecedores' ? 'Buscar fornecedor…' : 'Buscar contratante ou código…';
    document.querySelectorAll('#abas button').forEach(x => x.setAttribute('aria-selected', x.dataset.aba === aba));
    pintarResumo(); pintarChips(); render();
  }));

  pintarResumo(); pintarChips(); render();

  document.getElementById('busca').addEventListener('input', e => { termo = chave(e.target.value); render(); });
  document.getElementById('fechar').addEventListener('click', () => fechar());
  document.getElementById('veu').addEventListener('click', () => fechar());
  document.addEventListener('keydown', e => { if(e.key === 'Escape') fechar(); });
  window.addEventListener('hashchange', porHash);
  porHash();
})();

/* ---------- resumo ---------- */
function pintarResumo(){
  let blocos;
  if(aba === 'fornecedores'){
    const c = contarEtapas(DOC.fornecedores);
    blocos = [
      {v:DOC.fornecedores.length, r:'fornecedores na base', cls:''},
      {v:c[1], r:'treinados',         cls:'lj'},
      {v:c[2], r:'com app instalado', cls:'vd'},
      {v:c[3], r:'usando o IRIS',     cls:'vd'}
    ];
  } else {
    const L = DOC.contratantes;
    const ativos = L.filter(c => c.status !== 'Inativo').length;
    const treinados = L.filter(c => c.treinamento === 'Sim').length;
    blocos = [
      {v:L.length,          r:'contratantes na base', cls:''},
      {v:ativos,            r:'ativos',               cls:'vd'},
      {v:treinados,         r:'treinados',            cls:'vd'},
      {v:L.length - ativos, r:'inativos',             cls:'lj'}
    ];
  }
  document.getElementById('resumo').innerHTML = blocos.map(b =>
    `<div class="kpi ${b.cls}"><div class="v">${b.v}</div><div class="r"><em></em>${b.r}</div></div>`).join('');
}

function pintarChips(){
  document.getElementById('chips').innerHTML = filtros().map(f =>
    `<button class="chip" data-k="${f.k}" aria-pressed="${f.k === filtro}">${f.r}<b>${base().filter(f.f).length}</b></button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.k;
    document.querySelectorAll('#chips .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === filtro));
    render();
  }));
}

/* ---------- cards ---------- */
function visiveis(){
  const teste = (filtros().find(f => f.k === filtro) || filtros()[0]).f;
  if(aba === 'fornecedores'){
    const peso = {uso:0, web:1, espera:2, bloq:3, agd:4, pend:5};
    return DOC.fornecedores
      .filter(f => teste(f) && (!termo ||
        chave([f.nome, f.status, f.motivo, f.qualSistema, f.empresaGps, f.obs].join(' ')).includes(termo)))
      .sort((a,b) => (peso[situacao(a).k] - peso[situacao(b).k]) || (chave(a.nome) > chave(b.nome) ? 1 : -1));
  }
  return DOC.contratantes
    .filter(c => teste(c) && (!termo ||
      chave([rotuloC(c), c.codigo, c.produtos.join(' '), c.obs].join(' ')).includes(termo)))
    .sort((a,b) => (PESO_C[situacaoC(a).k] - PESO_C[situacaoC(b).k]) ||
      (chave(rotuloC(a)) > chave(rotuloC(b)) ? 1 : -1));
}

function render(){
  const itens = visiveis(), grade = document.getElementById('grade');
  if(!itens.length){
    grade.innerHTML = `<div class="nada"><b>Nada por aqui</b>Ajuste a busca ou troque o filtro.</div>`;
  } else if(aba === 'fornecedores'){
    grade.innerHTML = itens.map(f => cardHTML(f)).join('');
    ligarCards(grade, id => { location.hash = 'f/' + id; });
  } else {
    grade.innerHTML = itens.map(c => cardCHTML(c)).join('');
    ligarCards(grade, id => { location.hash = 'c/' + id; });
  }

  if(aba === 'fornecedores'){
    const emUso = itens.filter(f => ['uso','web'].includes(situacao(f).k)).length;
    const frota = itens.reduce((s,f) => s + (Number(f.frota) || 0), 0);
    document.getElementById('contagem').textContent =
      `${itens.length} de ${DOC.fornecedores.length} fornecedores · ${emUso} em uso · ${frota} veículos mapeados`;
  } else {
    const ativos = itens.filter(c => c.status !== 'Inativo').length;
    document.getElementById('contagem').textContent =
      `${itens.length} de ${DOC.contratantes.length} contratantes · ${ativos} ativos`;
  }
}

/* ---------- modal ---------- */
function porHash(){
  const m = location.hash.match(/^#([fc])\/(.+)$/);
  if(!m) return fechar(true);
  const id = decodeURIComponent(m[2]);
  if(m[1] === 'f'){
    const f = DOC.fornecedores.find(x => x.id === id);
    return f ? abrirF(f) : fechar(true);
  }
  const c = DOC.contratantes.find(x => x.id === id);
  return c ? abrirC(c) : fechar(true);
}

    <div class="bloco"><span class="rot">Frota e rastreamento</span><dl class="pares">
      ${par('Veículos', f.frota !== '' ? esc(f.frota) : '')}
      ${par('Rastreador GPS', esc(f.gps))}
      ${par('Empresa do rastreador', esc(f.empresaGps), true)}
    </dl></div>
    <div class="bloco"><span class="rot">Contato e notas</span><dl class="pares">
      ${par('Telefone', f.telefone ? `<a href="tel:${esc(f.telefone.replace(/\D/g,''))}">${esc(f.telefone)}</a>` : '', true)}
      ${par('Observações', esc(f.obs).replace(/\n/g,'<br>'), true)}
    </dl></div>`;
  mostrar();
}

function abrirC(c){
  const dias = diasDesde(c.dtTreinamento);
  document.getElementById('m-nome').textContent = rotuloC(c);
  document.getElementById('m-sit').innerHTML = sitCHTML(c);
  document.getElementById('m-corpo').innerHTML = `
    <div class="bloco"><span class="rot">Contratante</span><dl class="pares">
      ${par('Código', esc(c.codigo))}
      ${par('Status', esc(c.status))}
      ${par('Produtos contratados', tagsHTML(c), true)}
    </dl></div>
    <div class="bloco"><span class="rot">Treinamento</span><dl class="pares">
      ${par('Treinado', esc(c.treinamento) || 'Não')}
      ${par('Data', dataLonga(c.dtTreinamento))}
      ${par('Dias desde o treino', dias !== null ? dias + ' dias' : '', true)}
    </dl></div>
    <div class="bloco"><span class="rot">Notas</span><dl class="pares">
      ${par('Observações', esc(c.obs).replace(/\n/g,'<br>'), true)}
    </dl></div>`;
  mostrar();
}

function mostrar(){
  document.getElementById('modal').classList.add('on');
  document.getElementById('veu').classList.add('on');
  document.body.style.overflow = 'hidden';
  document.getElementById('fechar').focus();
}

function fechar(silencioso){
  document.getElementById('modal').classList.remove('on');
  document.getElementById('veu').classList.remove('on');
  document.body.style.overflow = '';
  if(!silencioso && location.hash) history.replaceState(null, '', location.pathname + location.search);
}
</script>
</body>
</html>
