<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>/* ============ TOKENS ============ */
:root{
  --verde:#16A34A; --verde-f:#15803D; --verde-c:#DCFCE7;
  --laranja:#F97316; --laranja-f:#C2410C; --laranja-c:#FFEDD5;
  --tinta:#1C1917; --suave:#78716C; --leve:#A8A29E;
  --linha:#D6D3D1; --borda:#B7B0A8; --fundo:#FAFAF9; --branco:#FFFFFF;
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--fundo);color:var(--tinta);font-size:15px;
  line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:70px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.25}
.env{max-width:1140px;margin:0 auto;padding:0 22px}
.vazio{color:var(--leve)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:4px}

/* ============ TOPO ============ */
.topo{background:var(--branco);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:30}
.topo .env{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.marca em{font-style:normal;width:9px;height:9px;border-radius:50%;background:var(--laranja);flex:none}
.marca span{font-weight:400;font-size:13px;color:var(--leve)}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fonte{font-size:11px;color:var(--leve)}
.lnk{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--suave)}
.lnk:hover{background:var(--fundo);color:var(--tinta)}
.lnk.on{background:var(--tinta);color:#fff}

/* ============ RESUMO ============ */
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:26px 0 4px}
.kpi{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);padding:16px 18px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .r{font-size:12.5px;color:var(--suave);margin-top:2px;display:flex;align-items:center;gap:7px}
.kpi .r em{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--leve);flex:none}
.kpi.vd .v{color:var(--verde)} .kpi.vd .r em{background:var(--verde)}
.kpi.lj .v{color:var(--laranja)} .kpi.lj .r em{background:var(--laranja)}

/* ============ BOLINHA ============ */
.bol{width:10px;height:10px;border-radius:50%;background:var(--c,var(--leve));position:relative;
  flex:none;display:inline-block}
.bol[data-p="1"]::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:var(--c);animation:pulso 2s cubic-bezier(.3,0,.3,1) infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.8);opacity:0}100%{transform:scale(2.8);opacity:0}}
.s-uso{--c:var(--verde)} .s-web{--c:var(--verde)} .s-espera{--c:var(--laranja)}
.s-bloq{--c:var(--laranja-f)} .s-agd{--c:var(--laranja)} .s-pend{--c:#C4BEB7}
.s-ativo{--c:var(--verde)} .s-inativo{--c:#C4BEB7}
.sit{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--c,var(--suave))}
.sit.s-pend,.sit.s-inativo{color:var(--leve)}

/* ============ ABAS ============ */
.abas{display:flex;gap:6px;padding:22px 0 0;border-bottom:1px solid var(--borda);margin-bottom:2px}
.abas button{font-size:14px;font-weight:500;color:var(--suave);padding:10px 4px 12px;margin-right:18px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button:hover{color:var(--tinta)}
.abas button[aria-selected="true"]{color:var(--tinta);font-weight:600;border-bottom-color:var(--laranja)}
.abas button b{font-weight:500;color:var(--leve);margin-left:6px;font-size:12.5px}

/* ============ TAGS DE PRODUTO ============ */
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;
  background:var(--verde-c);color:var(--verde-f);border:1px solid #A7E3BE}
.tag.off{background:var(--fundo);color:var(--leve);border-color:var(--borda);font-weight:400}
.par .tags{margin-top:4px}

/* ============ CHECKBOXES DE PRODUTO ============ */
.escolhas{display:flex;gap:8px;flex-wrap:wrap}
.escolha{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--borda);
  border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--branco)}
.escolha:hover{border-color:var(--suave)}
.escolha:has(input:checked){background:var(--verde-c);border-color:var(--verde);color:var(--verde-f)}
.escolha input{accent-color:var(--verde);width:15px;height:15px;cursor:pointer}

/* ============ FILTROS ============ */
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:22px 0 16px}
.busca{position:relative;flex:1 1 240px;min-width:190px}
.busca input{width:100%;background:var(--branco);border:1px solid var(--borda);border-radius:999px;
  padding:11px 16px 11px 40px;font-size:14px}
.busca input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-c)}
.busca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--leve)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;color:var(--suave);border:1px solid var(--borda);background:var(--branco);
  padding:8px 14px;border-radius:999px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--leve);color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip b{font-weight:500;opacity:.55;margin-left:6px}

/* ============ CARDS ============ */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);padding:18px;
  text-align:left;display:flex;flex-direction:column;gap:11px;min-height:152px;width:100%;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--suave);transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,25,23,.06)}
.card h3{font-size:15px;font-weight:600}
.card .meta{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;margin-top:-4px}
.card .pe{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--linha);padding-top:12px;margin-top:auto}
.card .pe small{font-size:11.5px;color:var(--leve);font-variant-numeric:tabular-nums}

.trilha{display:flex;gap:6px;align-items:center}
.trilha i{width:9px;height:9px;border-radius:50%;background:#DAD6D2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.trilha i[data-on="1"][data-e="1"],.trilha i[data-on="1"][data-e="2"]{background:var(--laranja)}
.trilha i[data-on="1"][data-e="3"],.trilha i[data-on="1"][data-e="4"]{background:var(--verde)}
.trilha i[data-pulo="1"]{background:var(--branco);box-shadow:inset 0 0 0 2.5px var(--verde)}

.nada{grid-column:1/-1;background:var(--branco);border:1px dashed var(--borda);border-radius:var(--r);
  padding:52px 20px;text-align:center;color:var(--suave)}
.nada b{display:block;color:var(--tinta);font-size:16px;margin-bottom:5px;font-weight:600}
.rodape{padding:20px 2px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:12px;color:var(--leve)}

/* ============ MODAL ============ */
.veu{position:fixed;inset:0;background:rgba(28,25,23,.38);-webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.veu.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);
  width:min(560px,calc(100% - 32px));max-height:min(88vh,880px);background:var(--branco);
  border-radius:18px;box-shadow:0 24px 60px rgba(28,25,23,.22);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .2s cubic-bezier(.2,.9,.3,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-topo{padding:22px 24px 16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--borda)}
.modal-topo h2{font-size:19px;padding-right:4px}
.modal-topo .sit{margin-bottom:7px}
.fechar{margin-left:auto;width:32px;height:32px;border-radius:50%;color:var(--suave);
  font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.fechar:hover{background:var(--fundo);color:var(--tinta)}
.modal-corpo{overflow-y:auto;padding:6px 24px 22px;flex:1}
.bloco{padding:18px 0;border-bottom:1px solid var(--linha)}
.bloco:last-child{border-bottom:none;padding-bottom:4px}
.rot{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--leve);margin-bottom:14px}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.par dt{font-size:11.5px;color:var(--leve);margin-bottom:2px}
.par dd{font-size:14px;font-weight:500;overflow-wrap:break-word}
.par.larga{grid-column:1/-1}

.passos{display:grid;gap:2px}
.passo{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.passo .pt{width:10px;height:10px;border-radius:50%;background:#DAD6D2;margin:0 auto}
.passo[data-on="1"][data-e="1"] .pt,.passo[data-on="1"][data-e="2"] .pt{background:var(--laranja)}
.passo[data-on="1"][data-e="3"] .pt,.passo[data-on="1"][data-e="4"] .pt{background:var(--verde)}
.passo[data-on="0"]{color:var(--leve)}
.passo small{font-size:12px;color:var(--leve);font-variant-numeric:tabular-nums}

/* ============ BOTÕES / FORM ============ */
.bt{font-size:13px;font-weight:500;border:1px solid var(--borda);background:var(--branco);
  padding:10px 16px;border-radius:999px;white-space:nowrap;transition:.15s}
.bt:hover{border-color:var(--leve);background:var(--fundo)}
.bt.forte{background:var(--verde);border-color:var(--verde);color:#fff}
.bt.forte:hover{background:var(--verde-f);border-color:var(--verde-f)}
.bt.laranja{background:var(--laranja);border-color:var(--laranja);color:#fff}
.bt.laranja:hover{background:var(--laranja-f);border-color:var(--laranja-f)}
.bt.perigo{color:var(--laranja-f);border-color:#F5D0BC}
.bt.perigo:hover{background:#FFF4ED}
.bt:disabled{opacity:.5;cursor:not-allowed}
.barra-adm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:20px 0 0}

.aviso{border-radius:var(--r);padding:13px 16px;font-size:13px;margin:16px 0;display:flex;gap:11px;
  align-items:flex-start;line-height:1.5;background:var(--laranja-c);color:#7C2D12}
.aviso.ok{background:var(--verde-c);color:#14532D}
.aviso.ruim{background:#FEE2E2;color:#7F1D1D}
.aviso b{font-weight:600}
.aviso code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-size:12px}

.campo{margin-bottom:14px}
.campo label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:5px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;background:var(--branco);border:1px solid var(--borda);
  border-radius:10px;padding:10px 12px;font-size:14px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--verde);
  box-shadow:0 0 0 3px var(--verde-c)}
.campo textarea{resize:vertical;min-height:74px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-pe{padding:16px 24px;border-top:1px solid var(--borda);display:flex;gap:8px;
  justify-content:flex-end;background:var(--fundo);border-radius:0 0 18px 18px;flex-wrap:wrap}
#excluir{margin-right:auto}

details.cofre{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r);margin:16px 0}
details.cofre summary{padding:15px 18px;cursor:pointer;font-size:13.5px;font-weight:500;border-radius:var(--r)}
details.cofre[open] summary{border-bottom:1px solid var(--linha);border-radius:var(--r) var(--r) 0 0}
details.cofre .dentro{padding:18px;max-width:560px}
.dica{font-size:13px;color:var(--suave);line-height:1.55;margin-bottom:16px}
.dica code{background:var(--fundo);border:1px solid var(--linha);padding:1px 5px;border-radius:4px;font-size:12px}

.card .acao{display:flex;gap:6px}
.card .acao button{font-size:11.5px;font-weight:500;color:var(--suave);border:1px solid var(--borda);
  padding:5px 10px;border-radius:999px}
.card .acao button:hover{border-color:var(--leve);color:var(--tinta)}
.card .acao button.x:hover{border-color:#F5D0BC;color:var(--laranja-f);background:#FFF4ED}

.chat{display:grid;gap:10px}
.msg{background:var(--fundo);border:1px solid var(--linha);border-radius:12px;padding:11px 13px}
.msg p{font-size:13.5px;white-space:pre-wrap;overflow-wrap:break-word}
.msg small{display:block;color:var(--leve);font-size:11.5px;margin-top:6px}
.linha-chat{display:flex;gap:8px;align-items:flex-start}
.linha-chat textarea{min-height:84px}
.linha-chat .bt{margin-top:21px}

/* ============ RESPONSIVO ============ */
@media(max-width:860px){
  .resumo{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:24px}
}
@media(max-width:520px){
  .grade{grid-template-columns:1fr}
  .pares,.dupla{grid-template-columns:1fr}
  .modal{max-height:92vh}
  .modal-topo,.modal-corpo,.modal-pe{padding-left:18px;padding-right:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topo">
  <div class="env">
    <div class="marca"><em></em>IRIS <span>Admin</span></div>
    <div class="topo-dir">
      <span class="fonte" id="selo-fonte"></span>
      <a class="lnk" href="index.html">Ver a Consulta</a>
      <button class="lnk" onclick="sair()">Sair</button>
    </div>
  </div>
</header>

<main class="env">
  <div id="estado"></div>

  <div class="barra-adm">
    <button class="bt forte" id="novo">+ Novo</button>
    <button class="bt" id="baixar">Baixar dados.json</button>
    <button class="bt" id="csv">Baixar CSV</button>
    <button class="bt" id="importar">Importar</button>
    <input type="file" id="arquivo" accept=".json,application/json" hidden>
    <button class="bt perigo" id="descartar" hidden>Descartar rascunho</button>
  </div>

  <details class="cofre">
    <summary>Publicar direto no GitHub Pages</summary>
    <div class="dentro">
      <p class="dica">Grava o <code>dados.json</code> no repositório e o Pages republica em ~1 minuto —
      é o que faz a Consulta atualizar para todo mundo. Use um token <em>fine-grained</em> com
      <b>Contents: Read and write</b> apenas neste repositório. Ele fica só neste navegador.</p>
      <div class="campo"><label for="gh-repo">Repositório (dono/nome)</label>
        <input id="gh-repo" placeholder="wilgner/iris-implantacao" autocomplete="off"></div>
      <div class="dupla">
        <div class="campo"><label for="gh-caminho">Caminho do arquivo</label>
          <input id="gh-caminho" value="dados.json" autocomplete="off"></div>
        <div class="campo"><label for="gh-branch">Branch</label>
          <input id="gh-branch" value="main" autocomplete="off"></div>
      </div>
      <div class="campo"><label for="gh-token">Token</label>
        <input id="gh-token" type="password" placeholder="github_pat_…" autocomplete="off"></div>
      <div class="barra-adm" style="padding-top:0">
        <button class="bt forte" id="publicar">Publicar agora</button>
        <button class="bt" id="salvar-cfg">Guardar configuração</button>
      </div>
      <div id="gh-msg"></div>
    </div>
  </details>

  <nav class="abas" id="abas" role="tablist">
    <button role="tab" data-aba="fornecedores" aria-selected="true">Fornecedores<b id="n-f"></b></button>
    <button role="tab" data-aba="contratantes" aria-selected="false">Contratantes<b id="n-c"></b></button>
    <button role="tab" data-aba="chamados" aria-selected="false">Chamados Sys4web<b id="n-s"></b></button>
  </nav>

  <div class="filtros">
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="busca" type="search" placeholder="Buscar para editar…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grade" id="grade"></div>
  <div class="rodape"><span id="contagem"></span><span id="atualizado"></span></div>
</main>

<div class="veu" id="veu"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-nome">
  <div class="modal-topo">
    <div><div id="m-sit"></div><h2 id="m-nome">Novo</h2></div>
    <button class="fechar" id="fechar" aria-label="Fechar">&#10005;</button>
  </div>
  <div class="modal-corpo" id="m-corpo"></div>
  <div class="modal-pe">
    <button class="bt perigo" id="excluir">Excluir</button>
    <button class="bt" id="cancelar">Cancelar</button>
    <button class="bt forte" id="salvar">Salvar</button>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>/* ===== GUARDA DE SESSÃO ===== */
const SESSAO_OK = 'baa15d3f8dd6ff59ae1802fd123ff8c959a35dd631879b25c25908e76ec06d73';
if(sessionStorage.getItem('iris_sessao') !== SESSAO_OK){
  location.replace('login.html?volta=' + encodeURIComponent(location.pathname.split('/').pop() + location.hash));
}
function sair(){ sessionStorage.removeItem('iris_sessao'); location.replace('login.html'); }

/* ===== NÚCLEO IRIS — lógica compartilhada entre View e Admin ===== */

const CAMPOS_VAZIOS = {
  id:'', nome:'', status:'Pendente', dtAgendamento:'', dtTreinamento:'', app:'', uso:'',
  motivo:'', temSistema:'', qualSistema:'', celular:'', frota:'', gps:'',
  dtInicioUso:'', empresaGps:'', telefone:'', obs:''
};

const CAMPOS_CONTRATANTE = { id:'', codigo:'', nome:'', status:'Ativo', produtos:[],
  treinamento:'Não', dtTreinamento:'', obs:'' };
const PRODUTOS = ['P1','P2','P3','P4'];

const OPCOES = {
  statusContratante: ['Ativo','Inativo'],
  simnaoC: ['Não','Sim'],
  status:  ['Pendente','Agendado','Treinado'],
  app:     ['','Sim','Não'],
  uso:     ['','Sim','Não','WEB'],
  motivo:  ['','Em Instalação','Sem Dispositivo','Usa Outro Sistema','iOS Incompatível','Recusa/Objeção','Não Quis','Inativo'],
  simnao:  ['','Sim','Não'],
  celular: ['','Sim','Não','somente pessoais'],
  sistema: ['','IRIS','Próprio','TCI','Ubr','Ezra']
};

const MOTIVOS_TRAVA = ['Recusa/Objeção','Não Quis','iOS Incompatível','Inativo'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function normalizar(f){ return Object.assign({}, CAMPOS_VAZIOS, f); }
function normalizarC(c){
  const o = Object.assign({}, CAMPOS_CONTRATANTE, c);
  o.produtos = Array.isArray(o.produtos) ? o.produtos.slice().sort() : [];
  return o;
}
function situacaoC(c){
  if(c.status === 'Inativo') return {k:'inativo', t:'Inativo'};
  return c.treinamento === 'Sim' ? {k:'ativo', t:'Ativo · treinado'} : {k:'agd', t:'Ativo · sem treinamento'};
}
const PESO_C = {ativo:0, agd:1, inativo:2};
function rotuloC(c){ return c.nome || ('Contratante ' + (c.codigo || 's/ código')); }

function idDe(nome, usados){
  let base = (nome||'fornecedor').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,48) || 'fornecedor';
  let id = base, i = 2;
  while(usados.has(id)){ id = base+'-'+(i++); }
  return id;
}

/* ---- situação consolidada (o que a planilha não mostra) ---- */
function situacao(f){
  if(f.uso === 'Sim') return {k:'uso',    t:'Em uso'};
  if(f.uso === 'WEB') return {k:'web',    t:'Em uso · web'};
  if(f.status === 'Treinado'){
    if(MOTIVOS_TRAVA.includes(f.motivo)) return {k:'bloq', t:f.motivo};
    return {k:'espera', t: f.motivo || 'Treinado · sem uso'};
  }
  if(f.status === 'Agendado') return {k:'agd', t:'Agendado'};
  return {k:'pend', t:'Pendente'};
}

/* ---- as 4 etapas da trilha de adoção ---- */
function etapas(f){
  const treinado = f.status === 'Treinado';
  return [
    {rot:'AGD', nome:'Agendamento',   on: !!f.dtAgendamento || treinado || f.status==='Agendado',
     qd: dataCurta(f.dtAgendamento) || (treinado ? 'sem data' : '')},
    {rot:'TRN', nome:'Treinamento',   on: treinado, qd: dataCurta(f.dtTreinamento) || (treinado ? 'sem data' : '')},
    {rot:'APP', nome:'App instalado', on: f.app === 'Sim', qd: f.app || ''},
    {rot:'USO', nome:'Em uso',        on: f.uso === 'Sim' || f.uso === 'WEB',
     qd: f.uso === 'WEB' ? 'pela web' : f.uso || ''}
  ];
}

function contarEtapas(lista){
  const c = [0,0,0,0];
  lista.forEach(f => etapas(f).forEach((e,i) => { if(e.on) c[i]++; }));
  return c;
}

/* ---- datas ---- */
function dataCurta(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return d && m ? `${d}/${m}/${a.slice(2)}` : '';
}
function dataLonga(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return d && m ? `${d}/${m}/${a}` : '';
}
function mesAno(iso){
  if(!iso) return '';
  const [a,m] = iso.split('-');
  return `${MESES[parseInt(m,10)-1]} ${a}`;
}
function diasDesde(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

/* ---- busca ---- */
function chave(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

/* ---- carregamento: Supabase primeiro, arquivo como reserva ---- */
async function carregarDados(){
  try{
    if(window.IRIS_DB?.configurado){
      const remoto = await window.IRIS_DB.carregarDoc();
      if(remoto && Array.isArray(remoto.fornecedores)) return {doc:remoto, fonte:'supabase'};
    }
  }catch(e){
    console.warn('Supabase indisponivel, usando dados.json.', e);
  }
  try{
    const r = await fetch('dados.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(!Array.isArray(j.fornecedores)) throw new Error('formato');
    return {doc:j, fonte:'arquivo'};
  }catch(e){
    return {doc: JSON.parse(JSON.stringify(SEMENTE)), fonte:'embutido'};
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- bolinhas: situação, trilha e card ---- */
function pulsa(f){ return f.status === 'Treinado' ? 1 : 0; }

function sitHTML(f){
  const s = situacao(f);
  return `<span class="sit s-${s.k}"><span class="bol" data-p="${pulsa(f)}"></span>${esc(s.t)}</span>`;
}

function trilhaHTML(f){
  const et = etapas(f);
  return '<div class="trilha" aria-label="etapas concluídas">' + et.map((e,i) => {
    const pulo = (i === 3 && e.on && !et[2].on) ? ' data-pulo="1"' : '';
    return `<i data-on="${e.on?1:0}" data-e="${i+1}"${pulo} title="${e.nome}: ${e.on ? 'sim' : 'não'}"></i>`;
  }).join('') + '</div>';
}

function cardHTML(f, rodape){
  const feitas = etapas(f).filter(e => e.on).length;
  const meta = [
    f.dtTreinamento ? 'Treinado em ' + dataCurta(f.dtTreinamento) : 'Sem treinamento',
    f.frota !== '' ? f.frota + ' veículos' : ''
  ].filter(Boolean).join(' · ');
  return `<div class="card" role="button" tabindex="0" data-id="${esc(f.id)}">
    ${sitHTML(f)}
    <h3>${esc(f.nome)}</h3>
    <div class="meta">${meta}</div>
    <div class="pe">${trilhaHTML(f)}${rodape || `<small>${feitas} de 4 etapas</small>`}</div>
  </div>`;
}

function ligarCards(raiz, aoAbrir){
  raiz.querySelectorAll('.card').forEach(c => {
    const ir = () => aoAbrir(c.dataset.id);
    c.addEventListener('click', e => { if(!e.target.closest('.acao')) ir(); });
    c.addEventListener('keydown', e => {
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.acao')){ e.preventDefault(); ir(); }
    });
  });
}

/* ---- passos detalhados dentro do modal ---- */
function passosHTML(f){
  return '<div class="passos">' + etapas(f).map((e,i) =>
    `<div class="passo" data-on="${e.on?1:0}" data-e="${i+1}">
       <span class="pt"></span><span>${e.nome}</span><small>${esc(e.qd) || '—'}</small>
     </div>`).join('') + '</div>';
}

/* ---- contratantes ---- */
function sitCHTML(c){
  const s = situacaoC(c);
  return `<span class="sit s-${s.k}"><span class="bol" data-p="${c.treinamento === 'Sim' ? 1 : 0}"></span>${s.t}</span>`;
}

function tagsHTML(c){
  return '<div class="tags">' + (c.produtos.length
    ? c.produtos.map(p => `<span class="tag">${esc(p)}</span>`).join('')
    : '<span class="tag off">sem produto</span>') + '</div>';
}

function cardCHTML(c, rodape){
  const meta = c.treinamento === 'Sim'
    ? (c.dtTreinamento ? 'Treinado em ' + dataCurta(c.dtTreinamento) : 'Treinado, sem data')
    : 'Sem treinamento';
  return `<div class="card" role="button" tabindex="0" data-id="${esc(c.id)}">
    ${sitCHTML(c)}
    <h3>${esc(rotuloC(c))}</h3>
    <div class="meta">${meta}</div>
    <div class="pe">${tagsHTML(c)}${rodape || ''}</div>
  </div>`;
}

function normalizarChamado(c){
  const o = Object.assign({id:'', numero:'', titulo:'', descricao:'', status:'Aberto',
    created_at:'', updated_at:'', atualizacoes:[]}, c || {});
  o.atualizacoes = Array.isArray(o.atualizacoes) ? o.atualizacoes : [];
  return o;
}
function sitSHTML(c){
  const aberto = c.status !== 'Resolvido';
  return `<span class="sit ${aberto ? 's-agd' : 's-uso'}"><span class="bol" data-p="${aberto ? 1 : 0}"></span>${esc(c.status || 'Aberto')}</span>`;
}
function cardSHTML(c, rodape){
  const qtd = c.atualizacoes?.length || 0;
  const meta = [
    c.numero ? 'Chamado ' + c.numero : 'Sem numero',
    qtd + (qtd === 1 ? ' atualizacao' : ' atualizacoes')
  ].join(' · ');
  return `<div class="card" role="button" tabindex="0" data-id="${esc(c.id)}">
    ${sitSHTML(c)}
    <h3>${esc(c.titulo || 'Chamado sem titulo')}</h3>
    <div class="meta">${esc(meta)}</div>
    <div class="pe"><small>${esc(dataLonga((c.updated_at || '').slice(0,10)) || 'Sem data')}</small>${rodape || ''}</div>
  </div>`;
}
</script>

    : aba === 'contratantes' ? '+ Novo contratante'
    : '+ Novo chamado';
  document.querySelectorAll('#abas button').forEach(x => x.setAttribute('aria-selected', x.dataset.aba === aba));
  contarAbas(); pintarChips(); render();
}
function contarAbas(){
  document.getElementById('n-f').textContent = DOC.fornecedores.length;
  document.getElementById('n-c').textContent = DOC.contratantes.length;
  document.getElementById('n-s').textContent = CHAMADOS.length;
}

/* ---------- rascunho ---------- */
function lerRascunho(){
  try{ const s = localStorage.getItem(K_RASCUNHO); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}
function lerChamadosLocais(){
  try{ const s = localStorage.getItem(K_CHAMADOS); return s ? JSON.parse(s).map(normalizarChamado) : []; }catch(e){ return []; }
}
function gravarChamadosLocais(){
  try{ localStorage.setItem(K_CHAMADOS, JSON.stringify(CHAMADOS)); }catch(e){}
}
function schemaSupabasePendente(e){
  return /schema cache|Could not find the table|PGRST205|404/i.test(String(e?.message || e || ''));
}
function avisarSchemaChamados(){
  setTimeout(() => alert('Salvei neste navegador. Para gravar no Supabase, rode o arquivo supabase-schema.sql no SQL Editor do Supabase e depois recarregue o Admin.'), 50);
}
function salvarChamadoLocal(dados){
  const salvo = normalizarChamado(Object.assign({}, dados, {
    id: dados.id || 'local-' + Date.now(),
    updated_at: new Date().toISOString(),
    created_at: new Date().toISOString()
  }));
  const antigo = dados.id ? CHAMADOS.find(x => x.id === dados.id) : null;
  salvo.atualizacoes = antigo?.atualizacoes || [];
  if(dados.id){
    const i = CHAMADOS.findIndex(x => x.id === dados.id);
    if(i >= 0) CHAMADOS[i] = salvo;
    else CHAMADOS.unshift(salvo);
  } else {
    CHAMADOS.unshift(salvo);
  }
  gravarChamadosLocais();
  contarAbas(); pintarChips(); render(); fechar();
}
async function carregarChamados(){
  try{
    if(window.IRIS_DB?.configurado) return (await window.IRIS_DB.listarChamados()).map(normalizarChamado);
  }catch(e){
    console.warn('Chamados no Supabase indisponiveis, usando localStorage.', e);
  }
  return lerChamadosLocais();
}
function marcarSujo(){
  sujo = true;
  DOC.atualizadoEm = new Date().toISOString().slice(0,10);
  try{ localStorage.setItem(K_RASCUNHO, JSON.stringify(DOC)); }
  catch(e){ alert('Não deu para guardar o rascunho neste navegador. Baixe o dados.json antes de fechar a aba.'); }
  pintarEstado();
  salvarDocRemoto();
}
function limparRascunho(){ sujo = false; localStorage.removeItem(K_RASCUNHO); pintarEstado(); }
function corpoObjeto(){
  return {
    atualizadoEm: DOC.atualizadoEm || new Date().toISOString().slice(0,10),
    origem: DOC.origem || 'admin IRIS',
    fornecedores: DOC.fornecedores.map(normalizar),
    contratantes: DOC.contratantes.map(normalizarC)
  };
}
async function salvarDocRemoto(){
  if(!window.IRIS_DB?.configurado) return;
  salvandoRemoto = true; pintarEstado();
  try{
    DOC = await window.IRIS_DB.salvarDoc(corpoObjeto());
    DOC.fornecedores = (DOC.fornecedores || []).map(normalizar);
    DOC.contratantes = (DOC.contratantes || []).map(normalizarC);
    fonteDados = 'supabase';
    document.getElementById('selo-fonte').textContent = 'Supabase';
    limparRascunho();
  }catch(e){
    console.warn('Nao foi possivel salvar no Supabase.', e);
  }finally{
    salvandoRemoto = false; pintarEstado();
  }
}

function pintarEstado(){
  document.getElementById('descartar').hidden = !sujo;
  document.getElementById('atualizado').textContent = 'Atualizado em ' + (dataLonga(DOC.atualizadoEm) || '—');
  const banco = window.IRIS_DB?.configurado;
  document.getElementById('estado').innerHTML = salvandoRemoto
    ? `<div class="aviso"><span>&#9679;</span><div><b>Sincronizando no Supabase.</b>
       Guardando a base para a Consulta ler direto do banco.</div></div>`
    : sujo
      ? `<div class="aviso"><span>&#9679;</span><div><b>Rascunho local, ainda não sincronizado.</b>
         ${banco ? 'O Supabase não confirmou o salvamento. Tente salvar de novo ou baixe o <code>dados.json</code>.' : 'As alterações estão salvas só neste navegador. Rode o schema do Supabase ou publique pelo GitHub.'}</div></div>`
      : `<div class="aviso ok"><span>&#10003;</span><div><b>Base sincronizada.</b>
         ${fonteDados === 'supabase' ? 'A Consulta esta lendo a base do Supabase.' : 'O que você vê aqui é o que a Consulta mostra.'}</div></div>`;
}
function descartar(){
  if(!confirm('Descartar todas as alterações locais e voltar ao dados.json publicado?')) return;
  localStorage.removeItem(K_RASCUNHO); location.reload();
}

/* ---------- cards ---------- */
function pintarChips(){
  document.getElementById('chips').innerHTML = filtros().map(f =>
    `<button class="chip" data-k="${f.k}" aria-pressed="${f.k === filtro}">${f.r}<b>${base().filter(f.f).length}</b></button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.k;
    document.querySelectorAll('#chips .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === filtro));
    render();
  }));
}

function visiveis(){
  const teste = (filtros().find(f => f.k === filtro) || filtros()[0]).f;
  if(aba === 'fornecedores'){
    const peso = {uso:0, web:1, espera:2, bloq:3, agd:4, pend:5};
    return DOC.fornecedores
      .filter(f => teste(f) && (!termo || chave([f.nome,f.status,f.motivo,f.qualSistema,f.obs].join(' ')).includes(termo)))
      .sort((a,b) => (peso[situacao(a).k] - peso[situacao(b).k]) || (chave(a.nome) > chave(b.nome) ? 1 : -1));
  }
  if(aba === 'chamados'){
    return CHAMADOS
      .filter(c => teste(c) && (!termo || chave([c.numero,c.titulo,c.descricao,c.status,
        (c.atualizacoes || []).map(a => a.mensagem).join(' ')].join(' ')).includes(termo)))
      .sort((a,b) => String(b.updated_at || b.created_at || '').localeCompare(String(a.updated_at || a.created_at || '')));
  }
  return DOC.contratantes
    .filter(c => teste(c) && (!termo || chave([rotuloC(c),c.codigo,c.produtos.join(' '),c.obs].join(' ')).includes(termo)))
    .sort((a,b) => (PESO_C[situacaoC(a).k] - PESO_C[situacaoC(b).k]) ||
      (chave(rotuloC(a)) > chave(rotuloC(b)) ? 1 : -1));
}

function render(){
  const itens = visiveis(), grade = document.getElementById('grade');
  const acao = id => `<div class="acao"><button class="x" data-ex="${esc(id)}">Excluir</button></div>`;
  grade.innerHTML = itens.length
    ? (aba === 'fornecedores'
        ? itens.map(f => cardHTML(f, acao(f.id))).join('')
        : aba === 'contratantes'
          ? itens.map(c => cardCHTML(c, acao(c.id))).join('')
          : itens.map(c => cardSHTML(c, acao(c.id))).join(''))
    : `<div class="nada"><b>Nada aqui</b>Ajuste a busca ou cadastre um registro.</div>`;
  ligarCards(grade, abrirForm);
  grade.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => remover(b.dataset.ex)));

  document.getElementById('contagem').textContent = aba === 'fornecedores'
    ? `${itens.length} de ${DOC.fornecedores.length} fornecedores`
    : aba === 'contratantes'
      ? `${itens.length} de ${DOC.contratantes.length} contratantes`
      : `${itens.length} de ${CHAMADOS.length} chamados Sys4web`;
}

async function remover(id){
  const lista = base(), r = lista.find(x => x.id === id);
  if(!r || !confirm(`Excluir "${aba === 'fornecedores' ? r.nome : aba === 'contratantes' ? rotuloC(r) : (r.titulo || r.numero)}" da base?`)) return;
  const nova = lista.filter(x => x.id !== id);
  if(aba === 'fornecedores'){
    DOC.fornecedores = nova; marcarSujo();
  } else if(aba === 'contratantes'){
    DOC.contratantes = nova; marcarSujo();
  } else {
    try{ if(window.IRIS_DB?.configurado && !id.startsWith('local-')) await window.IRIS_DB.excluirChamado(id); }
    catch(e){
      if(!schemaSupabasePendente(e)){ alert('Não deu para excluir no Supabase: ' + e.message); return; }
      avisarSchemaChamados();
    }
    CHAMADOS = nova; gravarChamadosLocais();
  }
  contarAbas(); pintarChips(); render();
}

async function salvar(){
  const v = c => (document.getElementById('c-' + c)?.value ?? '').trim();
  const nome = v('nome').replace(/\s+/g,' ');
  if(aba === 'fornecedores' && !nome){ alert('Informe o nome do fornecedor.'); document.getElementById('c-nome').focus(); return; }
  if(aba === 'contratantes' && !v('codigo') && !nome){ alert('Informe ao menos o código do contratante.'); document.getElementById('c-codigo').focus(); return; }
  if(aba === 'chamados'){ await salvarChamadoForm(); return; }

  if(aba === 'fornecedores'){
    const dados = {};
    Object.keys(CAMPOS_VAZIOS).forEach(c => { if(c !== 'id') dados[c] = v(c); });
    dados.nome = nome;
    if(editando){
      const i = DOC.fornecedores.findIndex(x => x.id === editando);
      DOC.fornecedores[i] = Object.assign({}, DOC.fornecedores[i], dados);
    } else {
      if(DOC.fornecedores.some(x => chave(x.nome) === chave(nome)) &&
         !confirm('Já existe um fornecedor com esse nome. Cadastrar mesmo assim?')) return;
      DOC.fornecedores.push(normalizar(Object.assign({id: idDe(nome, new Set(DOC.fornecedores.map(x => x.id)))}, dados)));
    }
  } else {
    const dados = {
      nome, codigo: v('codigo'), status: v('status') || 'Ativo', obs: v('obs'),
      treinamento: v('treinamento') || 'Não', dtTreinamento: v('dtTreinamento'),
      produtos: PRODUTOS.filter(p => document.getElementById('p-' + p)?.checked)
    };
    if(editando){
      const i = DOC.contratantes.findIndex(x => x.id === editando);
      DOC.contratantes[i] = normalizarC(Object.assign({}, DOC.contratantes[i], dados));
    } else {
      if(dados.codigo && DOC.contratantes.some(x => x.codigo === dados.codigo) &&
         !confirm('Já existe um contratante com esse código. Cadastrar mesmo assim?')) return;
      const usados = new Set(DOC.contratantes.map(x => x.id));
      DOC.contratantes.push(normalizarC(Object.assign({id: idDe('c-' + (dados.codigo || nome), usados)}, dados)));
    }
  }
  marcarSujo(); contarAbas(); pintarChips(); render(); fechar();
}

async function salvarChamadoForm(){
  const v = c => (document.getElementById('c-' + c)?.value ?? '').trim();
  const dados = {
    id: editando,
    numero: v('numero'),
    titulo: v('titulo').replace(/\s+/g,' '),
    descricao: v('descricao'),
    status: v('status') || 'Aberto'
  };
  if(!dados.titulo){
    alert('Informe o título do chamado.');
    document.getElementById('c-titulo').focus();
    return;
  }

  try{
    let salvo;
    if(window.IRIS_DB?.configurado){
      salvo = normalizarChamado(await window.IRIS_DB.salvarChamado(dados));
    } else {
      salvo = normalizarChamado(Object.assign({}, dados, {
        id: dados.id || 'local-' + Date.now(),
        updated_at: new Date().toISOString(),
        created_at: new Date().toISOString()
      }));
    }
    const antigo = editando ? CHAMADOS.find(x => x.id === editando) : null;
    salvo.atualizacoes = antigo?.atualizacoes || [];
    if(editando){
      const i = CHAMADOS.findIndex(x => x.id === editando);
      CHAMADOS[i] = salvo;
    } else {
      CHAMADOS.unshift(salvo);
    }
    gravarChamadosLocais();
    contarAbas(); pintarChips(); render(); fechar();
  }catch(e){
    console.warn('Supabase indisponivel para chamados, salvando localmente.', e);
    salvarChamadoLocal(dados);
    avisarSchemaChamados();
  }
}

async function adicionarAtualizacao(){
  const campo = document.getElementById('c-atualizacao');
  const mensagem = (campo?.value || '').trim();
  if(!editando || !mensagem) return;
  const chamado = CHAMADOS.find(x => x.id === editando);
  if(!chamado) return;

  const bt = document.getElementById('add-atualizacao');
  bt.disabled = true;
  try{
    let nova;
    if(window.IRIS_DB?.configurado && !editando.startsWith('local-')){
      nova = await window.IRIS_DB.adicionarAtualizacao(editando, mensagem);
    } else {
      nova = {id:'local-msg-' + Date.now(), chamado_id: editando, mensagem, created_at: new Date().toISOString()};
    }
    chamado.atualizacoes.push(nova);
    chamado.updated_at = nova.created_at;
    gravarChamadosLocais();
    contarAbas(); pintarChips(); render();
    abrirForm(editando);
  }catch(e){
    console.warn('Supabase indisponivel para atualizacoes, salvando localmente.', e);
    const nova = {id:'local-msg-' + Date.now(), chamado_id: editando, mensagem, created_at: new Date().toISOString()};
    chamado.atualizacoes.push(nova);
    chamado.updated_at = nova.created_at;
    gravarChamadosLocais();
    contarAbas(); pintarChips(); render();
    abrirForm(editando); avisarSchemaChamados();
  }finally{
    bt.disabled = false;
  }
}

function excluir(){ const id = editando; fechar(); remover(id); }

function fechar(){
  document.getElementById('modal').classList.remove('on');
  document.getElementById('veu').classList.remove('on');
  document.body.style.overflow = '';
  editando = null;
}

/* ---------- exportar / importar ---------- */
function corpoJSON(){
  return JSON.stringify(corpoObjeto(), null, 1);
}
function baixar(nome, texto, tipo){
  const url = URL.createObjectURL(new Blob([texto], {type: tipo}));
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function baixarJSON(){ baixar('dados.json', corpoJSON(), 'application/json;charset=utf-8'); }

function paraCSV(cab, linhas){
  return '\uFEFF' + [cab].concat(linhas)
    .map(l => l.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(';')).join('\r\n');
}
function baixarCSV(){
  if(aba === 'fornecedores'){
    const cab = ['Fornecedor','STATUS','dt_agendamento','dt_treinamento','APP_INSTALADO','UTILIZANDO',
      'Motivo N utilizacao','Tem sistema','Qual sistema','Celular Android/IOS','Frota','Rastreador GPS',
      'Data inicio utilizacao','Empresa Rastreador','Telefone','Mes Treinamento','Dias desde Treinamento','Observacoes'];
    const linhas = DOC.fornecedores.map(f => [f.nome,f.status,dataLonga(f.dtAgendamento),dataLonga(f.dtTreinamento),
      f.app,f.uso,f.motivo,f.temSistema,f.qualSistema,f.celular,f.frota,f.gps,dataLonga(f.dtInicioUso),
      f.empresaGps,f.telefone,mesAno(f.dtTreinamento),diasDesde(f.dtTreinamento) ?? '',f.obs]);
    baixar('implantacao_iris.csv', paraCSV(cab, linhas), 'text/csv;charset=utf-8');
  } else if(aba === 'contratantes') {
    const cab = ['codigo','razao_social','status','produtos','treinamento','data_treinamento','observacoes'];
    const linhas = DOC.contratantes.map(c => [c.codigo, c.nome, c.status, c.produtos.join(', '),
      c.treinamento, dataLonga(c.dtTreinamento), c.obs]);
    baixar('contratantes_iris.csv', paraCSV(cab, linhas), 'text/csv;charset=utf-8');
  } else {
    const cab = ['numero','titulo','status','descricao','ultima_atualizacao','qtd_atualizacoes'];
    const linhas = CHAMADOS.map(c => {
      const ultima = (c.atualizacoes || []).at(-1);
      return [c.numero, c.titulo, c.status, c.descricao, ultima?.mensagem || '', (c.atualizacoes || []).length];
    });
    baixar('chamados_sys4web.csv', paraCSV(cab, linhas), 'text/csv;charset=utf-8');
  }
}

function importar(e){
  const arq = e.target.files[0];
  if(!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const j = JSON.parse(leitor.result);
      if(!Array.isArray(j.fornecedores) && !Array.isArray(j.contratantes))
        throw new Error('arquivo sem "fornecedores" nem "contratantes"');
      const nF = (j.fornecedores || []).length, nC = (j.contratantes || []).length;
      if(!confirm(`Substituir a base atual pelos ${nF} fornecedores e ${nC} contratantes do arquivo?`)) return;
      const uF = new Set(), uC = new Set();
      DOC = {
        atualizadoEm: j.atualizadoEm || new Date().toISOString().slice(0,10),
        origem: j.origem || arq.name,
        fornecedores: (j.fornecedores || []).map(f => {
          const n = normalizar(f);
          n.id = n.id && !uF.has(n.id) ? n.id : idDe(n.nome, uF);
          uF.add(n.id); return n;
        }),
        contratantes: (j.contratantes || []).map(c => {
          const n = normalizarC(c);
          n.id = n.id && !uC.has(n.id) ? n.id : idDe('c-' + (n.codigo || n.nome), uC);
          uC.add(n.id); return n;
        })
      };
      marcarSujo(); contarAbas(); pintarChips(); render();
    }catch(err){ alert('Não foi possível ler o arquivo: ' + err.message); }
    finally{ e.target.value = ''; }
  };
  leitor.readAsText(arq, 'utf-8');
}

/* ---------- publicação no GitHub ---------- */
function lerCfg(){
  try{
    const c = JSON.parse(localStorage.getItem(K_GH) || '{}');
    if(c.repo) document.getElementById('gh-repo').value = c.repo;
    if(c.caminho) document.getElementById('gh-caminho').value = c.caminho;
    if(c.branch) document.getElementById('gh-branch').value = c.branch;
    if(c.token) document.getElementById('gh-token').value = c.token;
  }catch(e){}
}
function gravarCfg(){
  localStorage.setItem(K_GH, JSON.stringify({
    repo: document.getElementById('gh-repo').value.trim(),
    caminho: document.getElementById('gh-caminho').value.trim(),
    branch: document.getElementById('gh-branch').value.trim(),
    token: document.getElementById('gh-token').value.trim()
  }));
}
function msgGH(tipo, texto){
  document.getElementById('gh-msg').innerHTML =
    `<div class="aviso ${tipo === 'ok' ? 'ok' : tipo === 'ruim' ? 'ruim' : ''}"><span>${tipo === 'ok' ? '&#10003;' : '&#9679;'}</span><div>${texto}</div></div>`;
}
function b64(texto){
  const bytes = new TextEncoder().encode(texto);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

async function publicar(){
  const repo = document.getElementById('gh-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
  const caminho = document.getElementById('gh-caminho').value.trim() || 'dados.json';
  const branch = document.getElementById('gh-branch').value.trim() || 'main';
  const token = document.getElementById('gh-token').value.trim();
  if(!/^[^/]+\/[^/]+$/.test(repo) || !token){
    msgGH('ruim','Preencha o repositório no formato <code>dono/nome</code> e o token.'); return;
  }
  const bt = document.getElementById('publicar');
  bt.disabled = true; msgGH('', 'Publicando…');
  const cab = {Authorization:'Bearer ' + token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  const url = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(caminho).replace(/%2F/g,'/')}`;

  try{
    let sha = null;
    const atual = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, {headers: cab});
    if(atual.ok) sha = (await atual.json()).sha;
    else if(atual.status !== 404) throw new Error(`leitura falhou (${atual.status})`);

    const r = await fetch(url, {
      method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, cab),
      body: JSON.stringify({
        message: `dados: ${DOC.fornecedores.length} fornecedores e ${DOC.contratantes.length} contratantes`,
        content: b64(corpoJSON()), branch, sha
      })
    });
    if(!r.ok){
      const e = await r.json().catch(() => ({}));
      throw new Error(`${r.status} — ${e.message || 'verifique token, repositório e branch'}`);
    }
    gravarCfg(); limparRascunho();
    msgGH('ok','Publicado. O GitHub Pages leva até 1 minuto para servir o arquivo novo — depois disso a Consulta já mostra os dados atualizados.');
  }catch(err){
    msgGH('ruim','Não deu para publicar: ' + err.message + '. O rascunho continua salvo aqui — use <b>Baixar dados.json</b> como alternativa.');
  }finally{ bt.disabled = false; }
}
